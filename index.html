<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Panglao Trip 2026</title><meta name="description" content="Notre guide de voyage à Panglao, Bohol, du 26 au 29 octobre 2026."><meta name="theme-color" content="#0B5563"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Panglao 2026"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap"><style>:root{padding-top:env(safe-area-inset-top,0px)}/* Layout: one-column phone app — illustrated hero, swipeable day tabs, bottom tab bar; boarding-pass stubs for bookings */
:root{
  --lagoon:#0B5563; --glass:#5CBFAE; --coral:#EE6448; --mango:#F6A93B; --ink:#0F2E35; --mute:#5C7772;
  --bg:#EDF5F3; --surface:#FFFFFF; --surface2:#F5FAF9; --line:#D6E6E2; --chip:#E1F0EC;
  --ok:#23845A; --okbg:#DCF2E6; --todo:#C24A2F; --todobg:#FCE5DD; --wait:#9A6A10; --waitbg:#FBEFD3; --info:#3E5B9A; --infobg:#E3E9F7;
  --shadow:0 1px 2px rgba(11,85,99,.08),0 6px 18px rgba(11,85,99,.07);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --lagoon:#7FD3C6; --glass:#3FA593; --coral:#FF7E62; --mango:#FFBE5C; --ink:#E4F1EE; --mute:#93B2AC;
  --bg:#071A1F; --surface:#0E262D; --surface2:#123038; --line:#1F3F47; --chip:#163A42;
  --ok:#6FD6A0; --okbg:#143A2A; --todo:#FF9A80; --todobg:#3D2019; --wait:#F4C470; --waitbg:#3A2E12; --info:#A9BEF0; --infobg:#1D2943;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --lagoon:#7FD3C6; --glass:#3FA593; --coral:#FF7E62; --mango:#FFBE5C; --ink:#E4F1EE; --mute:#93B2AC;
  --bg:#071A1F; --surface:#0E262D; --surface2:#123038; --line:#1F3F47; --chip:#163A42;
  --ok:#6FD6A0; --okbg:#143A2A; --todo:#FF9A80; --todobg:#3D2019; --wait:#F4C470; --waitbg:#3A2E12; --info:#A9BEF0; --infobg:#1D2943;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--lagoon)}
:focus-visible{outline:2.5px solid var(--coral);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;margin-inline:-4px;padding-inline:4px}
.top .back{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow)}
.top .back[hidden]{display:none}
.top .ttl{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .act{height:36px;padding:0 12px;border-radius:12px;display:flex;align-items:center;gap:6px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:13px}
.ico{width:18px;height:18px;flex:0 0 auto}

/* views */
.view{display:none}
.view.on{display:block;animation:enter .32s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:20px}
.sec .more{font-size:13px;font-weight:600;color:var(--lagoon)}
.lead{color:var(--mute);margin:0 0 12px}

/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:330px;color:#fff;box-shadow:var(--shadow);margin-top:4px;isolation:isolate}
.hero svg.sc{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,30,38,.05) 30%,rgba(6,30,38,.62) 100%)}
.hero .in{padding:22px 20px 44px;display:flex;flex-direction:column;min-height:330px}
.hero .eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.95}
.hero h1{font-size:44px;line-height:.95;font-weight:800;margin-top:auto}
.hero h1 span{display:block;font-size:20px;font-weight:600;letter-spacing:.02em;margin-top:8px;opacity:.95}
.hero .hotel{margin-top:14px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:10px 12px;font-size:13.5px;color:#fff;text-decoration:none}
.hero .hotel b{display:block;font-size:14.5px}
.hero .hotel .go{margin-left:auto;font-weight:700;font-size:12px;background:#fff;color:#0B5563;border-radius:999px;padding:5px 10px;white-space:nowrap}

/* countdown */
.count{margin-top:-28px;position:relative;z-index:2;margin-inline:10px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;display:flex;align-items:center;gap:14px}
.count .lbl{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.count .big{font-family:var(--display);font-weight:800;font-size:21px;white-space:nowrap;line-height:1.05;color:var(--lagoon)}
.count .cells{display:flex;gap:8px;margin-left:auto}
.count .cell{min-width:46px;text-align:center;background:var(--chip);border-radius:12px;padding:6px 4px}
.count .cell b{display:block;font-family:var(--display);font-size:20px;line-height:1.1;color:var(--ink)}
.count .cell small{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;text-align:center;min-width:0;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff}
.tile .ic svg{width:20px;height:20px}
@media (max-width:360px){.tiles{grid-template-columns:repeat(3,1fr)}}

/* preview list */
.plist{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.prow{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.prow:last-child{border-bottom:0}
.prow .t{font-weight:700;font-size:13px;color:var(--lagoon);width:44px;flex:0 0 auto}
.prow .x{min-width:0;flex:1}
.prow .x b{display:block;font-size:14.5px;font-weight:600}
.prow .x span{font-size:12.5px;color:var(--mute)}

/* chips & pills */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-inline:-2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--lagoon);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-todo{background:var(--todobg);color:var(--todo)}.p-wait{background:var(--waitbg);color:var(--wait)}.p-info{background:var(--infobg);color:var(--info)}
.p-v{background:var(--okbg);color:var(--ok)}.p-e{background:var(--waitbg);color:var(--wait)}

/* day */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.dbtn{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:8px 4px;text-align:center;transition:transform .15s}
.dbtn small{display:block;font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.dbtn b{font-family:var(--display);font-size:22px}
.dbtn[aria-pressed="true"]{background:var(--lagoon);color:var(--bg)}
.dbtn[aria-pressed="true"] small{color:inherit;opacity:.85}
.dayhero{position:relative;border-radius:22px;overflow:hidden;color:#fff;margin-top:14px;min-height:170px;box-shadow:var(--shadow);isolation:isolate}
.dayhero svg.sc{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.dayhero .shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,30,38,0) 20%,rgba(6,30,38,.7))}
.dayhero .in{padding:16px;display:flex;flex-direction:column;justify-content:flex-end;min-height:170px}
.dayhero .d{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.dayhero h2{font-size:26px;line-height:1.05;margin-top:4px}
.dayhero .b{margin-top:8px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap}
.dayhero .b span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 9px}
.tl{position:relative;margin-top:16px;padding-left:58px}
.tl::before{content:"";position:absolute;left:47px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.ti{position:relative;margin-bottom:12px;animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:.0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ti .tm{position:absolute;left:-58px;top:12px;width:40px;text-align:right;font-weight:700;font-size:13px;color:var(--lagoon)}
.ti .dot{position:absolute;left:-17px;top:12px;width:16px;height:16px;border-radius:50%;border:3px solid var(--bg);background:var(--k,var(--glass))}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;width:100%;text-align:left;display:block;transition:transform .15s}
.card:active{transform:scale(.985)}
.ti .card{display:flex;gap:0}
.ti .thumb{flex:0 0 78px;min-height:84px;position:relative}
.ti .thumb svg{position:absolute;inset:0;width:100%;height:100%}
.ti .body{padding:10px 12px;min-width:0;flex:1}
.ti .kind{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--k,var(--lagoon))}
.ti h3{font-size:15.5px;line-height:1.2;margin-top:2px}
.ti p{margin:4px 0 0;font-size:13px;color:var(--mute)}
.ti .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.mini{font-size:11.5px;font-weight:600;background:var(--chip);border-radius:8px;padding:2px 7px;color:var(--ink)}

/* place cards (food/explore) */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
.pc{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-align:left;display:flex;flex-direction:column;min-width:0;animation:rise .35s both}
.pc .ph{position:relative;aspect-ratio:16/10;max-width:100%}
.pc .ph svg{position:absolute;inset:0;width:100%;height:100%}
.pc .ph .tagf{position:absolute;left:8px;top:8px}
.pc .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pc b{font-size:14.5px;line-height:1.2}
.pc .sp{font-size:12.5px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .ft{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font-size:12px;font-weight:600}
.pc .ft .d{color:var(--lagoon)}
.note{background:var(--waitbg);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.note b{color:var(--wait)}

/* explore */
.radar{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:8px;position:relative}
.radar svg{width:100%;height:auto;display:block}
.radar .lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--mute);padding:4px 8px 6px}
.radar .lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.rlist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.rrow{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.rrow .dt{width:52px;flex:0 0 auto;text-align:center}
.rrow .dt b{display:block;font-family:var(--display);font-size:17px;color:var(--lagoon)}
.rrow .dt small{font-size:10.5px;color:var(--mute)}
.rrow .x{min-width:0;flex:1}
.rrow .x b{display:block;font-size:14.5px}
.rrow .x span{font-size:12.5px;color:var(--mute)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(4,20,25,.48);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .sh{position:relative;height:190px}
.sheet .sh svg{position:absolute;inset:0;width:100%;height:100%}
.sheet .grab{position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:rgba(255,255,255,.75)}
.sheet .close{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));width:34px;height:34px;border-radius:50%;background:rgba(6,30,38,.45);color:#fff;display:grid;place-items:center}
.sheet .sb{padding:16px max(18px,env(safe-area-inset-left,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
.sheet h2{font-size:24px;line-height:1.1}
.sheet .tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.sheet p{margin:0 0 12px}
.rows{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin:12px 0}
.rw{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.rw:last-child{border-bottom:0}
.rw dt{width:92px;flex:0 0 auto;color:var(--mute);font-weight:600;font-size:13px}
.rw dd{margin:0;min-width:0;flex:1}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btn{flex:1 1 140px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:14px;font-weight:700;font-size:14px;text-decoration:none;text-align:center}
.btn.pri{background:var(--lagoon);color:var(--bg)}
.btn.sec2{background:var(--surface);color:var(--lagoon);box-shadow:var(--shadow)}
.btn.cor{background:var(--coral);color:#fff}
.near{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.near .chip{font-size:12.5px}
.copy{display:inline-flex;align-items:center;gap:6px}
.copy code{font-family:var(--body);font-weight:600;user-select:all}
.copy button{font-size:11.5px;font-weight:700;color:var(--lagoon);background:var(--chip);padding:3px 8px;border-radius:8px}

/* bookings: boarding-pass stub */
.bk{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;animation:rise .35s both}
.bk .hd{display:flex;gap:12px;padding:14px 16px;align-items:flex-start;width:100%;text-align:left}
.bk .hd .x{flex:1;min-width:0}
.bk .hd h3{font-size:17px}
.bk .hd .when{font-size:12.5px;color:var(--mute);font-weight:600;margin-top:2px}
.bk .hd p{margin:6px 0 0;font-size:13px;color:var(--mute)}
.bk .perf{height:0;border-top:2px dashed var(--line);margin:0 14px;position:relative}
.bk .perf::before,.bk .perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.bk .perf::before{left:-24px}.bk .perf::after{right:-24px}
.bk .pv{padding:6px 16px 14px}
.prov{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px;background:var(--surface2)}
.prov .pn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prov .pn b{font-size:15px}
.prov .ds{font-size:13px;color:var(--mute);margin:5px 0 8px}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 8px}
.prices div{background:var(--surface);border-radius:12px;padding:7px 10px}
.prices small{display:block;font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.prices b{font-family:var(--display);font-size:16px}
.kv{font-size:13px;margin:4px 0}
.kv span{color:var(--mute);font-weight:600}
.seg{display:inline-flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px;margin-top:10px}
.seg button{font-size:12px;font-weight:700;padding:6px 10px;border-radius:9px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.segl{font-size:11.5px;color:var(--mute);margin-top:4px}

/* budget */
.toggle{display:flex;background:var(--surface);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.toggle button{flex:1;padding:9px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mute)}
.toggle button[aria-pressed="true"]{background:var(--lagoon);color:var(--bg)}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tot div{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px}
.tot small{font-size:12px;color:var(--mute);font-weight:600}
.tot b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;color:var(--lagoon)}
.bars{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px}
.bar{display:grid;grid-template-columns:62px 1fr 74px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.bar .tr{display:block;height:12px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar .fl{display:block;height:100%;border-radius:6px;background:var(--glass);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar .v{text-align:right;font-weight:700}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.opt:last-child{border-bottom:0}
.opt input{width:20px;height:20px;accent-color:var(--lagoon);margin-top:1px;flex:0 0 auto}
.opt .x{flex:1}
.opt .x small{color:var(--mute)}
.lines{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:4px 14px;margin-top:10px}
.ln{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ln:last-child{border-bottom:0}
.ln .l{flex:1;min-width:0}
.ln .a{font-weight:700;text-align:right;white-space:nowrap}
.dh{font-family:var(--display);font-weight:700;font-size:15px;margin:14px 0 4px;color:var(--lagoon)}

/* checklist */
.prog{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 16px}
.prog svg{width:58px;height:58px;flex:0 0 auto}
.cg{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:4px 14px;margin-top:12px}
.cg h3{font-size:15px;padding:10px 0 4px;color:var(--lagoon)}
.ck{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.ck input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--glass);flex:0 0 auto;display:grid;place-items:center;margin:0;transition:background .2s}
.ck input:checked{background:var(--glass)}
.ck input:checked::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck input:checked + span{color:var(--mute);text-decoration:line-through}

/* info */
.wt{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.wt th{background:var(--lagoon);color:var(--bg);text-align:left;padding:8px 10px;font-size:12px}
.wt td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbx{overflow-x:auto}
.ctc{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:2px 14px}
.ctc .rw dt{width:auto;flex:1;color:var(--ink);font-weight:600;font-size:14px}
.ctc .rw dd{flex:0 0 auto}
.tips{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:6px 16px 6px 34px;margin:0}
.tips li{padding:6px 0;font-size:14px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px}
.step{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px 12px 50px;position:relative;font-size:14px}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--glass);color:var(--surface);font-weight:800;display:grid;place-items:center;font-size:13px}
.src{font-size:12.5px;color:var(--mute)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);box-shadow:0 -1px 0 var(--line),0 -8px 24px rgba(11,85,99,.08);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mute);position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--lagoon)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-6px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--coral)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{font-size:12px;color:var(--mute);text-align:center;margin:26px 0 8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.ph-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ph-img,.dayhero .ph-img{z-index:-1}
[hidden]{display:none!important}

      '<div class="sec"><h2>Par poste</h2><span class="more" style="color:var(--mute)">pour 6</span></div><div class="bars num">' +

      '<div class="sec"><h2>Options</h2></div><div class="lines">' + D.options.map(function (o) {

      }).join("") + "</div>" +
      '<div class="sec"><h2>Détail</h2></div>' + D.days.map(function (d) {
        return '<div class="dh">' + esc(d.label) + " · " + esc(d.title) + '</div><div class="lines" style="margin-top:4px">' + D.budget.filter(function (b) { return b.day === d.n; }).map(function (b) {
          return '<div class="ln"><span class="l">' + esc(b.label) + "</span>" + ps(b.s) + '<span class="a num">' + peso(b[m]) + "</span></div>";
        }).join("") + "</div>";
      }).join("") +
      '<p class="foot">« Prix vérifié » : tarif publié par le prestataire ou une source officielle. « Estimé » : à confirmer sur place.</p>';
  }

  /* ---------- checklist ---------- */
  function rCheck() {
    var done = store.get("chk", { flights_ok: true, hotel_ok: true }), all = 0, n = 0;
    D.checklist.forEach(function (g) { g.items.forEach(function (it) { all++; if (done[it.id]) n++; }); });
    var pct = all ? n / all : 0, C = 2 * Math.PI * 24;

  /* ---------- infos ---------- */
  function rInfos() {
    $("#v-infos").innerHTML = '<div class="sec" style="margin-top:6px"><h2>Météo & marées</h2></div><p class="lead">Prévisions du 25 octobre, fiables à 1-3 jours. Aucun cyclone ne menace les Visayas. Vent très faible : mer calme.</p>' +
      '<div class="tbx"><table class="wt"><tr><th>Jour</th><th>Prévision</th><th>Max</th><th>Marée basse</th></tr>' + D.info.weather.map(function (w) { return "<tr><td><b>" + esc(w[0]) + "</b></td><td>" + esc(w[1]) + '</td><td class="num">' + esc(w[2]) + '</td><td class="num">' + esc(w[3]) + "</td></tr>"; }).join("") + "</table></div>" +

      '<div class="sec"><h2>Sur iPhone (Safari)</h2></div><div class="steps"><div class="step">Ouvrir le lien dans <b>Safari</b>.</div><div class="step">Toucher le bouton <b>Partager</b> (carré avec une flèche).</div><div class="step">Choisir <b>« Sur l\'écran d\'accueil »</b>, puis <b>Ajouter</b>.</div></div>' +

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-copy],[data-share],[data-close],[data-place],[data-item],[data-go],[data-goday],[data-day],[data-food],[data-filter],[data-bk],[data-mode]");
    if (!t) { if (e.target.id === "scrim") closeSheet(); return; }
    if (t.hasAttribute("data-copy")) { e.stopPropagation(); var code = t.parentNode.querySelector("code"); copyText(t.getAttribute("data-copy"), code); return; }
    if (t.hasAttribute("data-share")) { shareLink(); return; }
    if (t.hasAttribute("data-place")) { e.stopPropagation(); openPlace(t.getAttribute("data-place")); return; }
    if (t.hasAttribute("data-item")) { var a = t.getAttribute("data-item").split(":"); itemSheet(+a[0], +a[1]); return; }
    if (t.hasAttribute("data-close") && !t.hasAttribute("data-go")) { closeSheet(); return; }
    if (t.hasAttribute("data-go")) { closeSheet(); show(t.getAttribute("data-go")); return; }
    if (t.hasAttribute("data-goday")) { state.day = +t.getAttribute("data-goday"); show("days"); return; }

    if (t.hasAttribute("data-food")) { state.food = t.getAttribute("data-food"); rFood(); return; }
    if (t.hasAttribute("data-filter")) { state.filter = t.getAttribute("data-filter"); rExplore(); return; }
    if (t.hasAttribute("data-bk")) { store.set("bk:" + t.getAttribute("data-bk"), t.getAttribute("data-st")); rBookings(); toast("Statut mis à jour sur ce téléphone"); return; }
    if (t.hasAttribute("data-mode")) { state.mode = t.getAttribute("data-mode"); store.set("mode", state.mode); rBudget(); return; }
  });
  document.addEventListener("keydown", function (e) {

    if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset.ck) { var d = store.get("chk", { flights_ok: true, hotel_ok: true }); d[t.dataset.ck] = t.checked; store.set("chk", d); rCheck(); var el = document.getElementById(t.id); if (el) el.focus(); }
    if (t.dataset.opt) { var o = store.get("opts", {}); o[t.dataset.opt] = t.checked; store.set("opts", o); rBudget(); var el2 = document.getElementById(t.id); if (el2) el2.focus(); }
  });

  document.addEventListener("touchend", function (e) {
